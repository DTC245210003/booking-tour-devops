# HTTP -> chuyen huong sang HTTPS
server {
    listen 8080;
    server_name _;
    server_tokens off;
    return 301 https://$host$request_uri;
}

# HTTPS - reverse proxy
server {
    listen 8443 ssl;
    http2 on;
    server_name _;
    server_tokens off;

    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # Web Booking Tour
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; frame-ancestors 'self'" always;

        proxy_pass http://app:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Khong cho nguoi ngoai xem metrics cua app
    location = /metrics {
        return 404;
    }

    # pgAdmin qua duong dan /pgadmin/
    location /pgadmin/ {
        include /etc/nginx/snippets/security-headers.conf;
        proxy_set_header X-Script-Name /pgadmin;
        proxy_set_header X-Scheme $scheme;
        proxy_set_header Host $host;
        proxy_pass http://pgadmin:80/;
        proxy_redirect off;
    }
}

# Trang thai Nginx - chi cho mang noi bo (dung cho Prometheus o giai doan 3)
server {
    listen 8081;
    location /stub_status {
        stub_status;
        allow 127.0.0.1;
        allow 172.16.0.0/12;
        deny all;
    }
}
